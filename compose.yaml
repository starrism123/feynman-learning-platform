services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - feynman-mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/feynman-db
      JWT_SECRET: course-demo-secret-change-before-real-deployment
      JWT_EXPIRES_IN: 5h
      STUDENT_NAME: YourName
      STUDENT_MAJOR: YourMajor
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  feynman-mongo-data:
