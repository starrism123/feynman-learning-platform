openapi: 3.0.3
info:
  title: 费曼学习平台后端 API
  version: 1.0.0
  description: 《大前端与AI实战》第 1–9 课实现。正式认证方式为 Bearer Token，同时兼容 x-auth-token。
servers:
  - url: http://localhost:3000
tags:
  - name: 基础
  - name: 用户
  - name: 知识点
  - name: 语音
  - name: AI
  - name: 知识库
paths:
  /:
    get:
      tags: [基础]
      summary: Hello World
      responses:
        "200":
          description: 服务器启动成功
          content:
            text/html:
              schema:
                type: string
                example: Hello, Feynman Learner!
  /user:
    get:
      tags: [基础]
      summary: 获取课程选做接口中的学生信息
      responses:
        "200":
          description: 学生信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  major: { type: string }
  /health:
    get:
      tags: [基础]
      summary: 健康检查
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/users/register:
    post:
      tags: [用户]
      summary: 注册并自动登录
      description: username 是正式字段；为兼容第三课讲义，也可单独传 name。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users/login:
    post:
      tags: [用户]
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/register:
    post:
      tags: [用户]
      deprecated: true
      summary: 第二课讲义兼容注册路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201": { description: 与 /api/users/register 相同 }
  /api/login:
    post:
      tags: [用户]
      deprecated: true
      summary: 第二课讲义兼容登录路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200": { description: 与 /api/users/login 相同 }
  /api/knowledge-points:
    get:
      tags: [知识点]
      summary: 获取当前用户的全部知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 知识点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      knowledgePoints:
                        type: array
                        items: { $ref: "#/components/schemas/KnowledgePoint" }
                      count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [知识点]
      summary: 创建知识点
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointCreateInput"
      responses:
        "201": { description: 创建成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/knowledge-points/{id}:
    parameters:
      - $ref: "#/components/parameters/KnowledgePointId"
    get:
      tags: [知识点]
      summary: 获取单个知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 查询成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [知识点]
      summary: 部分更新知识点
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointUpdateInput"
      responses:
        "200": { description: 更新成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [知识点]
      summary: 兼容讲义的更新入口
      description: 与 PATCH 使用相同的部分更新语义，供第三课讲义演示。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointUpdateInput"
      responses:
        "200": { description: 更新成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [知识点]
      summary: 删除知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/knowledge-points/{id}/attempts:
    parameters:
      - $ref: "#/components/parameters/KnowledgePointId"
    get:
      tags: [知识点]
      summary: 查看该知识点最近 20 次费曼复述记录
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 查询成功 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/audio/transcribe:
    post:
      tags: [语音]
      summary: 上传录音并转成文字（第 7 课，后端转发给本地 Whisper）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  {
                    type: string,
                    format: binary,
                    description: 录音文件，不超过 25MB,
                  }
      responses:
        "200": { description: 识别成功，data.result 为文字 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: 语音识别服务未启动 }
  /api/ai/evaluate:
    post:
      tags: [AI]
      summary: AI 润色复述并打分，同时存档（第 8 课）
      description: 先调用 DeepSeek，失败时自动回退到本地 Ollama。分数低于 60 时知识点自动加入复习列表。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgePointId, transcribedText]
              properties:
                knowledgePointId: { type: string }
                transcribedText: { type: string }
      responses:
        "200":
          {
            description: 返回 polishedText、score、dimensions、strengths、weaknesses、provider,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { description: 所有大模型服务都不可用 }
  /api/ai/generate-question:
    post:
      tags: [AI]
      summary: 按知识点和难度出题（第 9 课）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                knowledgePointId: { type: string }
                knowledgePointContent:
                  { type: string, description: 讲义写法，直接传内容 }
                difficulty: { type: string, enum: [基础, 中等, 困难] }
                type: { type: string, enum: [single-choice, short-answer] }
      responses:
        "200":
          {
            description: 单选题含 options/answer/explanation，简答题含 answer_key_points,
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { description: AI 返回格式不完整或服务不可用 }
  /api/ai/grade-answer:
    post:
      tags: [AI]
      summary: AI 批改简答题（第 9 课挑战）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answerKeyPoints, studentAnswer]
              properties:
                question: { type: string }
                answerKeyPoints: { type: array, items: { type: string } }
                studentAnswer: { type: string }
      responses:
        "200": { description: 返回 isCorrect、score、explanation }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/rag/status:
    get:
      tags: [知识库]
      summary: 查看向量库状态（第 10 课）
      description: 每个知识点切成了几个文本块、最近一次建索引的时间和向量模型。chunks 为 0 表示还没进向量库。
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 返回 knowledgePoints、totalChunks、missing }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/rag/reindex:
    post:
      tags: [知识库]
      summary: 重建当前用户的向量索引（第 10 课）
      description: 把当前用户的所有知识点重新切块、向量化。需要本机 AI 服务（whisper-service）已启动，否则返回 503。
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 返回重建的知识点数和文本块数 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: 向量化服务未启动 }
  /api/rag/search:
    post:
      tags: [知识库]
      summary: 语义检索（第 10 课）
      description: 只检索、不调用大模型，返回和问题最相似的文本块及相似度（0–1，越大越相关）。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 500 }
                limit: { type: integer, minimum: 1, maximum: 10, default: 4 }
      responses:
        "200": { description: 返回 results（title、text、score 等） }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    legacyToken:
      type: apiKey
      in: header
      name: x-auth-token
  parameters:
    KnowledgePointId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
  schemas:
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 50, deprecated: true }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      properties:
        _id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            token: { type: string }
            user: { $ref: "#/components/schemas/User" }
    KnowledgePointCreateInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/KnowledgeStatus" }
        reviewList: { type: boolean, default: false }
    KnowledgePointUpdateInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/KnowledgeStatus" }
        reviewList: { type: boolean }
      additionalProperties: false
    KnowledgeStatus:
      type: string
      enum: [not_started, in_progress, mastered]
    KnowledgePoint:
      allOf:
        - $ref: "#/components/schemas/KnowledgePointCreateInput"
        - type: object
          properties:
            _id: { type: string }
            user: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: { type: object }
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在或不属于当前用户
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 用户名或邮箱冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
