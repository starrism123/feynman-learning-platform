openapi: 3.0.3
info:
  title: 费曼学习平台后端 API
  version: 1.0.0
  description: 《大前端与AI实战》前三课实现。正式认证方式为 Bearer Token，同时兼容 x-auth-token。
servers:
  - url: http://localhost:3000
tags:
  - name: 基础
  - name: 用户
  - name: 知识点
paths:
  /:
    get:
      tags: [基础]
      summary: Hello World
      responses:
        "200":
          description: 服务器启动成功
          content:
            text/html:
              schema:
                type: string
                example: Hello, Feynman Learner!
  /user:
    get:
      tags: [基础]
      summary: 获取课程选做接口中的学生信息
      responses:
        "200":
          description: 学生信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  major: { type: string }
  /health:
    get:
      tags: [基础]
      summary: 健康检查
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /api/users/register:
    post:
      tags: [用户]
      summary: 注册并自动登录
      description: username 是正式字段；为兼容第三课讲义，也可单独传 name。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/users/login:
    post:
      tags: [用户]
      summary: 登录并获取 JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/register:
    post:
      tags: [用户]
      deprecated: true
      summary: 第二课讲义兼容注册路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201": { description: 与 /api/users/register 相同 }
  /api/login:
    post:
      tags: [用户]
      deprecated: true
      summary: 第二课讲义兼容登录路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200": { description: 与 /api/users/login 相同 }
  /api/knowledge-points:
    get:
      tags: [知识点]
      summary: 获取当前用户的全部知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: 知识点列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      knowledgePoints:
                        type: array
                        items: { $ref: "#/components/schemas/KnowledgePoint" }
                      count: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [知识点]
      summary: 创建知识点
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointCreateInput"
      responses:
        "201": { description: 创建成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/knowledge-points/{id}:
    parameters:
      - $ref: "#/components/parameters/KnowledgePointId"
    get:
      tags: [知识点]
      summary: 获取单个知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 查询成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [知识点]
      summary: 部分更新知识点
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointUpdateInput"
      responses:
        "200": { description: 更新成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [知识点]
      summary: 兼容讲义的更新入口
      description: 与 PATCH 使用相同的部分更新语义，供第三课讲义演示。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgePointUpdateInput"
      responses:
        "200": { description: 更新成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [知识点]
      summary: 删除知识点
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 删除成功 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    legacyToken:
      type: apiKey
      in: header
      name: x-auth-token
  parameters:
    KnowledgePointId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-fA-F0-9]{24}$" }
  schemas:
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        username: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 50, deprecated: true }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, format: password }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    User:
      type: object
      properties:
        _id: { type: string }
        username: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          type: object
          properties:
            token: { type: string }
            user: { $ref: "#/components/schemas/User" }
    KnowledgePointCreateInput:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/KnowledgeStatus" }
        reviewList: { type: boolean, default: false }
    KnowledgePointUpdateInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 120 }
        content: { type: string, maxLength: 20000 }
        status: { $ref: "#/components/schemas/KnowledgeStatus" }
        reviewList: { type: boolean }
      additionalProperties: false
    KnowledgeStatus:
      type: string
      enum: [not_started, in_progress, mastered]
    KnowledgePoint:
      allOf:
        - $ref: "#/components/schemas/KnowledgePointCreateInput"
        - type: object
          properties:
            _id: { type: string }
            user: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items: { type: string }
  responses:
    Success:
      description: 请求成功
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              data: { type: object }
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未认证或 Token 无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 资源不存在或不属于当前用户
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 用户名或邮箱冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
